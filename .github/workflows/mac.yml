name: Build and test on macOS

on:
  push:
    branches:
      - main
      - workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: OCaml 5 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-26-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          brew install pkgconf openblas libomp
          # Discover Homebrew's prefix on both Apple Silicon and Intel, and
          # preserve it for setup-ocaml and all subsequent build steps.
          echo "PKG_CONFIG_PATH=$(brew --prefix openblas)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Use latest OCaml 5
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
          opam-local-packages: "*.opam"
          dune-cache: true

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Show toolchain
        run: |
          opam exec -- ocamlc -version
          cc --version
          pkg-config --cflags --libs openblas

      - name: Compile Owl
        run: opam exec -- dune build @install

      - name: Run tests
        # Build all local packages together so tests use this checkout's owl-base.
        run: opam exec -- dune runtest -j 1 --no-buffer
