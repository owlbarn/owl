name: Build and test on macOS

on:
  push:
    branches:
      - main
      - workflow
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: OCaml 5 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - macos-26-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          brew install pkgconf openblas libomp llvm
          # Discover Homebrew's prefix on both Apple Silicon and Intel, and
          # preserve it for setup-ocaml and all subsequent build steps.
          echo "PKG_CONFIG_PATH=$(brew --prefix openblas)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          # OpenBLAS's pkg-config flags enable OpenMP in Owl's C stubs.
          echo "OWL_LDFLAGS=-L$(brew --prefix libomp)/lib -lomp" >> "$GITHUB_ENV"

      - name: Select LLVM before building OCaml
        run: |
          # OCaml records its C compiler, which Dune then uses for C stubs.
          # Override cc before setup-ocaml, not just CC in a later build step.
          llvm_bin="$(brew --prefix llvm)/bin"
          toolchain_dir="$RUNNER_TEMP/owl-toolchain"
          mkdir -p "$toolchain_dir"
          ln -sf "$llvm_bin/clang" "$toolchain_dir/cc"
          ln -sf "$llvm_bin/clang++" "$toolchain_dir/c++"
          echo "$toolchain_dir" >> "$GITHUB_PATH"
          echo "CC=$toolchain_dir/cc" >> "$GITHUB_ENV"
          echo "CXX=$toolchain_dir/c++" >> "$GITHUB_ENV"

      - name: Use latest OCaml 5
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
          opam-local-packages: "*.opam"
          dune-cache: true
          cache-prefix: macos-llvm

      - name: Install OCaml dependencies
        run: opam install . --deps-only --with-test --yes

      - name: Show toolchain
        run: |
          opam exec -- ocamlc -version
          opam exec -- ocamlc -config-var c_compiler
          cc --version
          pkg-config --cflags --libs openblas

      - name: Work around LLVM vector-combine crash on Intel
        if: runner.arch == 'X64'
        # LLVM 22 crashes in this pass while optimizing complex32_modf.
        run: echo "OWL_CPPFLAGS=-mllvm -disable-vector-combine" >> "$GITHUB_ENV"

      - name: Compile Owl
        run: opam exec -- dune build @install

      - name: Run tests
        # Build all local packages together so tests use this checkout's owl-base.
        run: opam exec -- dune runtest -j 1 --no-buffer
